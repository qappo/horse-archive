<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horse_Archive - 首页</title>
  <link rel="icon" type="image/png" href="assets/rabbit.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="home-title-row">
        <div>
          <p class="site-eyebrow">Tsukimi_ichigo's</p>
          <h1 class="site-title">Horse_Archive</h1>
        </div>
        <a class="button button-secondary home-updates-link" href="updates.html">更新日志</a>
      </div>
      <div class="header-actions" id="header-actions"></div>
    </header>

    <main class="page page-home">
      <section class="hero-panel">
        <div>
          <h2 id="home-hero-title">欢迎来到月见莓の马小屋！！🌈</h2>
          <p class="hero-text" id="home-hero-text">这里用于归档马匹投稿与编辑器作品。发布内容前请确认图片、说明与附件信息完整，QQ群：1106310306。</p>
        </div>
        <div class="inline-actions">
          <a class="button button-secondary" href="favorites.html">我的收藏</a>
          <a class="button" href="upload.html">创建新帖</a>
        </div>
      </section>

      <nav class="home-section-tabs" aria-label="内容区域">
        <button class="home-section-tab active" data-home-area="horses" type="button">马匹</button>
        <button class="home-section-tab" data-home-area="editor" type="button">编辑器</button>
        <button class="home-section-tab" data-home-area="gene" type="button">基因编辑<span>未开放</span></button>
      </nav>

      <section class="home-avatar-panel hidden" id="home-avatar-panel">
        <div>
          <p class="section-kicker">Avatar</p>
          <h2 class="section-title">上传头像</h2>
        </div>
        <div class="home-avatar-content">
          <div class="home-avatar-preview">
            <img id="home-avatar-preview" alt="头像">
          </div>
          <form class="home-avatar-form" id="home-avatar-form">
            <label class="field-label" for="home-avatar-file">选择头像图片</label>
            <input id="home-avatar-file" type="file" accept="image/*" required>
            <button class="button" type="submit">保存头像</button>
          </form>
        </div>
        <div class="status-box hidden" id="home-avatar-status"></div>
      </section>

      <section class="section-header">
        <div>
          <p class="section-kicker" id="archive-kicker">Archive</p>
          <h2 class="section-title" id="archive-title">马匹列表</h2>
          <div class="tag-filter-row hidden" id="tag-filter-row" aria-label="Tag 筛选"></div>
        </div>
        <p class="section-meta" id="horse-count">加载中...</p>
      </section>

      <section class="home-results-section">
        <div class="status-box" id="home-status">正在读取帖子数据...</div>
        <div class="horse-grid" id="horse-grid"></div>
      </section>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme-button.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/horses.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
